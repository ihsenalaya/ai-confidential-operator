{{- if .Values.console.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "operator.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-console-role
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
rules:
# Full CRUD on this operator's own 7 CRDs — the console never touches
# anything outside its own API group.
- apiGroups: ["aiops.imperium.io"]
  resources:
  - aievidencerecords
  - aikeyreleasepolicies
  - aiplacementdecisions
  - airevocationpolicies
  - attestationevidences
  - confidentialinferencepolicies
  - rawattestationreports
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# Namespace picker in the UI.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Reading the live OpenAPI schema of exactly these 7 CRDs, to generate forms
# — scoped by name, not a blanket read on all CustomResourceDefinitions.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get"]
  resourceNames:
  - aievidencerecords.aiops.imperium.io
  - aikeyreleasepolicies.aiops.imperium.io
  - aiplacementdecisions.aiops.imperium.io
  - airevocationpolicies.aiops.imperium.io
  - attestationevidences.aiops.imperium.io
  - confidentialinferencepolicies.aiops.imperium.io
  - rawattestationreports.aiops.imperium.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-console-rolebinding
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "operator.fullname" . }}-console-role
subjects:
- kind: ServiceAccount
  name: {{ include "operator.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
{{- end }}
