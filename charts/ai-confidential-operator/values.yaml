# Default values for ai-confidential-operator.

replicaCount: 1

image:
  repository: ghcr.io/ihsenalaya/ai-confidential-operator/confidential-operator
  # kind / local image: --set image.repository=confidential-operator --set image.tag=dev --set image.pullPolicy=Never
  tag: ""        # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC ClusterRole/Binding for the controller.
rbac:
  create: true

# Leader election (enable for HA / multiple replicas).
leaderElection:
  enabled: false

# Compatibility switches. In the split architecture the dedicated
# central-verifier binary remains the single writer of AttestationEvidence;
# these embedded fallbacks exist for development only.
compat:
  enableLegacyEvidenceReconciler: false
  enableEmbeddedVerifier: false

metrics:
  bindAddress: ":8080"
  port: 8080
  service:
    enabled: true
    type: ClusterIP
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    labels: {}

health:
  bindAddress: ":8081"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod-level security context (non-root).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # webhook serving certs are written under /tmp
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Extra args appended to the manager command.
extraArgs: []

# Graphical console (create/edit CRDs without writing YAML), deployed
# alongside the operator with its own dedicated ServiceAccount/RBAC scoped to
# only this operator's 7 CRDs. Enabled by default so installing this chart
# anywhere brings the console with it — see console-rbac.yaml,
# console-deployment.yaml, console-service.yaml.
console:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ihsenalaya/ai-confidential-operator/console-api
    # kind / local image: --set console.image.repository=console-api --set console.image.tag=dev --set console.image.pullPolicy=Never
    tag: ""        # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
